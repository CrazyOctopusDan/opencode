# Fork 专用：在 GitHub Actions 上构建 Windows Desktop 安装包
# 与 publish.yml 的 build-tauri（Windows 分支）逻辑对齐

name: Build Desktop (Windows)

on:
  push:
    branches: [dev-sapphire]
  workflow_dispatch:

concurrency:
  group: build-desktop-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - id: version
        run: |
          V=$(node -p "require('./packages/opencode/package.json').version")
          echo "version=$V" >> $GITHUB_OUTPUT

  build-cli:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - run: ./packages/opencode/script/build.ts --all
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

  build-desktop-windows:
    needs: [version, build-cli]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: x86_64-pc-windows-msvc

      - name: Prepare
        run: |
          cd packages/desktop
          bun ./scripts/prepare.ts
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          RUST_TARGET: x86_64-pc-windows-msvc
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Build and upload artifacts
        uses: tauri-apps/tauri-action@390cbe447412ced1303d35abe75287949e43437a
        timeout-minutes: 60
        with:
          projectPath: packages/desktop
          uploadWorkflowArtifacts: true
          args: --target x86_64-pc-windows-msvc --config ./src-tauri/tauri.prod.conf.json --verbose
          updaterJsonPreferNsis: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
